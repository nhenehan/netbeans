[package]
name = "unbuffer"
version = "1.0.0"
edition = "2021"
description = "LD_PRELOAD library that makes a program's stdout unbuffered (drop-in for the C unbuffer.so)"
license = "Apache-2.0"
publish = false

# no_std and no dependencies: the library is loaded into arbitrary programs and
# must only use their libc (setbuf, stdout), not bring its own.
[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"
test = false
doctest = false
bench = false
