[package]
name = "nativeexecution_helpers"
version = "1.0.0"
edition = "2021"
description = "Linux helper executables for the NetBeans dlight.nativeexecution module (drop-ins for the C tools)"
license = "Apache-2.0"
publish = false

# One binary per helper; the IDE finds them as
# bin/nativeexecution/<osname>-<platform><_isa>/<name> (HelperUtility.java).
[[bin]]
name = "killall"
path = "src/bin/killall.rs"

[[bin]]
name = "pty_open"
path = "src/bin/pty_open.rs"

[[bin]]
name = "pty"
path = "src/bin/pty.rs"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
